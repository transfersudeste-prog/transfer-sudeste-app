name: Atualizar aplicativo

on:
  push:
    branches: [main]
    paths: [atualizacao.zip]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-aplicativo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backup
        run: |
          git branch backup/$(date -u +%Y%m%d-%H%M%S)
          git push origin --all

      - name: Extrair arquivos
        run: |
          unzip -t atualizacao.zip
          unzip -o atualizacao.zip
          rm atualizacao.zip
          test -f index.html

      - name: Registrar atualizacao
        run: |
          git config user.name "Transfer Sudeste"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualizacao automatica do aplicativo"
          git push origin main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
